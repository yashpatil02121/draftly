# Render Blueprint: one web service (API + built client) and a free Postgres database.
# Free-tier caveats (check current terms): the web service sleeps after inactivity (first request is slow)
# and free Postgres instances expire after a limited period. Neon's free Postgres is a good alternative:
# remove the `databases` block and set DATABASE_URL (+ DATABASE_SSL=true) by hand.
services:
  - type: web
    name: draftly
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: draftly-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false # you'll be prompted for it on first deploy; share it with reviewers in SUBMISSION.md
databases:
  - name: draftly-db
    plan: free
